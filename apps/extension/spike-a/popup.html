<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Talkr Spike A</title>
    <style>
      :root {
        --orange: #f97316;
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 280px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
        letter-spacing: 0.02em;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 12px;
        font-size: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        font: inherit;
        font-weight: 600;
        background: var(--orange);
        color: var(--bg);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.stop {
        background: var(--fg);
      }
      #status {
        margin-top: 10px;
        padding: 8px;
        border-left: 3px solid var(--orange);
        background: rgba(249, 115, 22, 0.08);
        color: var(--muted);
        font-size: 12px;
        min-height: 14px;
      }
      #timer {
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
        color: var(--fg);
        font-size: 22px;
        font-weight: 600;
      }
      #mic-state {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <h1>Talkr Spike A</h1>
    <p class="sub">Captures the active tab + your mic. On stop, downloads two WAVs to verify call-leg routing.</p>
    <button id="start">Start capture</button>
    <button id="stop" class="stop" style="display:none;margin-top:8px;">Stop &amp; save</button>
    <div id="timer"></div>
    <div id="mic-state"></div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
